<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cait Burke — front-end engineer and designer. I design it, then I build it."
    />
    <title>Cait Burke — Portfolio</title>

    <!-- Share previews: read by link unfurlers that don't run JS, so site-wide. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://caitburke.dev/" />
    <meta property="og:site_name" content="Cait Burke — Portfolio" />
    <meta property="og:title" content="Cait Burke — Design + Front-End Engineering" />
    <meta
      property="og:description"
      content="I design it, then I build it. Front-end engineer and designer — Amazon Prime, AWS and The CB Creative."
    />
    <meta property="og:image" content="https://caitburke.dev/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cait Burke — Design + Front-End Engineering" />
    <meta
      name="twitter:description"
      content="I design it, then I build it. Front-end engineer and designer — Amazon Prime, AWS and The CB Creative."
    />
    <meta name="twitter:image" content="https://caitburke.dev/og-image.jpg" />

    <!-- Fraunces (display serif), IBM Plex Sans (body), IBM Plex Mono (labels/eyebrows): self-hosted in src/styles/fonts.css.
         Every hero heading sets Fraunces in both styles, so those two load early. -->
    <link rel="preload" href="/src/assets/fonts/fraunces-roman.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/fraunces-italic.woff2" as="font" type="font/woff2" crossorigin />

    <!-- landing-only:start — the fern poster is the landing page's LCP. The build writes app.html without this
         block for every other route (see vite.config.ts and vercel.json). Breakpoint matches FernBackground. -->
    <link rel="preload" as="image" href="/media/fern/mobile.jpg" media="not all and (min-width: 700px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/media/fern/desktop.jpg" media="(min-width: 700px)" fetchpriority="high" />
    <!-- landing-only:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
